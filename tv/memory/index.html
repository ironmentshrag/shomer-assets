<title>זיכרון על המסך</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: a TV screen. one dark look by choice: it runs on a television, not in a document. */
:root{--bg:#07090c;--fg:#e8eef2;--dim:#8a98a4;--acc:#39d0dd;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:relative;width:100%;height:100%;max-width:100%}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#gl{z-index:1} #hud{z-index:2;pointer-events:none}
#report{position:absolute;z-index:3;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);margin:0;padding:8px 12px;
  font:14px/1.4 ui-monospace,monospace;direction:ltr;text-align:left;background:rgba(7,9,12,.85);color:var(--fg);
  white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
#bar{position:absolute;z-index:4;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#copy{font:600 14px system-ui,sans-serif;color:var(--bg);background:var(--acc);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
#copy:focus-visible{outline:3px solid var(--fg)}
#ver{font:600 13px system-ui,sans-serif;color:#f4b544;background:rgba(7,9,12,.6);padding:6px 10px;border-radius:6px;margin-inline-start:auto}
#sent{font:600 13px system-ui,sans-serif;color:var(--dim)}
#full{font:600 14px system-ui,sans-serif;color:var(--bg);background:#f4b544;text-decoration:none;border-radius:6px;padding:8px 14px}
#full:focus-visible{outline:3px solid var(--fg)}
</style>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="bar" dir="rtl">
    <a id="full" href="https://raw.githack.com/ironmentshrag/shomer-assets/main/tv/memory/index.html" target="_blank" rel="noopener">▶ גרסה עם דיווח אוטומטי</a>
    <button id="copy" type="button">העתק דוח</button>
    <div id="sent"></div>
    <div id="ver">גרסה 13 · זיכרון על המסך · מודד את עצמו לבד</div>
  </div>
  <pre id="report">L · memory-tv · מתחיל…</pre>
</div>
<script>
(function(){
'use strict';
/* ============================================================ מצב */
var glc=document.getElementById('gl'), hud=document.getElementById('hud'), rep=document.getElementById('report');
var gl=glc.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:false})||glc.getContext('experimental-webgl');
var W=0,H=0,dpr=1;
var MODES=['normal','heavy','empty'], mode=0;
var cols=4, rows=4, cards=[], cursor=0, open=[], matched=0, moves=0, lock=0, won=false;
var started=performance.now(), finalized=false, report='';
var RELAY='https://odiron-relayd-lab-936c.ironmentsh.workers.dev/tv-mem', sentN=0, lastSend=0;
function send(tag){try{var body=(tag?tag+' ':'')+report;var x=new XMLHttpRequest();x.open('POST',RELAY,true);x.timeout=8000;
  x.onload=function(){sentN++;document.getElementById('sent').textContent='נשלח לממסר ✔ '+sentN;};
  x.onerror=x.ontimeout=function(){document.getElementById('sent').textContent='מכאן הדוח לא נשלח. פתח את הגרסה עם הדיווח האוטומטי';};x.send(body);}catch(e){}}
/* מחולל אקראי משלי, כדי שסידור הקלפים יחזור על עצמו לפי זרע */
var seed=0x9E3779B1;
function rnd(){seed=(seed^(seed<<13))>>>0;seed=(seed^(seed>>>17))>>>0;seed=(seed^(seed<<5))>>>0;return (seed>>>0)/4294967296;}
function deal(){
  var ids=[];for(var i=0;i<8;i++){ids.push(i);ids.push(i);}
  for(var k=ids.length-1;k>0;k--){var j=Math.floor(rnd()*(k+1));var t=ids[k];ids[k]=ids[j];ids[j]=t;}
  cards=[];for(var c=0;c<16;c++)cards.push({id:ids[c],flip:0,target:0,done:false});
  open=[];matched=0;moves=0;lock=0;won=false;cursor=0;
}
deal();

/* ============================================================ מדידה מבפנים */
var frameTimes=[], lastT=0, longFrames=0, frames=0, glErrors=0, lastReport=0;
function fps(){ if(frameTimes.length<10)return{fps:0,low:0};
  var s=0;for(var i=0;i<frameTimes.length;i++)s+=frameTimes[i];
  var sorted=frameTimes.slice().sort(function(a,b){return a-b});
  var p99=sorted[Math.min(sorted.length-1,Math.floor(sorted.length*0.99))];
  return{fps:1000/(s/frameTimes.length),low:1000/p99};
}
function memMB(){try{var m=performance.memory;return m?(m.usedJSHeapSize/1048576).toFixed(1):'~'}catch(e){return'~'}}

/* ============================================================ שיידרים (WebGL1, בטוח ל־fp16) */
function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){glErrors++;rep.textContent='שגיאת שיידר: '+gl.getShaderInfoLog(s);}return s;}
function prog(vs,fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))glErrors++;return p;}
var VS_CARD='attribute vec2 a;uniform vec4 u_rect;uniform float u_flip;varying vec2 v;'+
 'void main(){v=a;float sx=abs(cos(u_flip*3.14159));vec2 p=u_rect.xy+vec2((a.x-0.5)*sx+0.5,a.y)*u_rect.zw;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
/* דוגמאות הקלפים: כל החישובים עם קבועים קטנים, בלי sin על מספרים גדולים */
var FS_CARD='precision mediump float;varying vec2 v;uniform float u_id;uniform float u_face;uniform float u_sel;uniform float u_done;'+
 'vec3 pal(float i){return 0.5+0.5*cos(vec3(0.0,2.1,4.2)+i*0.9);}'+
 'void main(){vec2 q=v*2.0-1.0;float d=0.0;'+
 ' if(u_face<0.5){d=step(0.92,max(abs(q.x),abs(q.y)));gl_FragColor=vec4(mix(vec3(0.10,0.13,0.18),vec3(0.22,0.60,0.66),d*0.6+u_sel*0.5),1.0);return;}'+
 ' float i=u_id;float r=length(q);float a=atan(q.y,q.x);'+
 ' if(i<0.5)d=step(0.5,fract(q.x*3.0));'+
 ' else if(i<1.5)d=step(0.5,fract(r*4.0));'+
 ' else if(i<2.5)d=step(0.5,fract(q.x*2.0))*step(0.5,fract(q.y*2.0))+ (1.0-step(0.5,fract(q.x*2.0)))*(1.0-step(0.5,fract(q.y*2.0)));'+
 ' else if(i<3.5)d=step(0.6,fract(a*0.955+0.5));'+
 ' else if(i<4.5)d=step(0.25,length(fract(q*2.5)-0.5));'+
 ' else if(i<5.5)d=step(0.0,q.x*q.y);'+
 ' else if(i<6.5)d=step(0.5,fract((q.x+q.y)*2.5));'+
 ' else d=step(0.7,r)+step(r,0.3);'+
 ' vec3 c=mix(pal(i),vec3(0.95),clamp(d,0.0,1.0)*0.85);'+
 ' float edge=step(0.92,max(abs(q.x),abs(q.y)));c=mix(c,vec3(0.2,0.9,0.5),u_done*0.6);c=mix(c,vec3(1.0),edge*(0.3+u_sel*0.7));'+
 ' gl_FragColor=vec4(c,1.0);}';
var VS_PT='attribute vec2 a;uniform float u_t;uniform vec2 u_asp;varying float vi;'+
 'void main(){vi=a.y;float x=fract(a.x+u_t*0.03*(0.5+fract(a.y*7.0)));float y=fract(a.y+u_t*0.05*(0.3+fract(a.x*5.0)));'+
 'gl_Position=vec4(x*2.0-1.0,y*2.0-1.0,0.0,1.0);gl_PointSize=2.0+3.0*fract(a.x*3.0);}';
var FS_PT='precision mediump float;varying float vi;uniform float u_heavy;'+
 'float h(vec2 p){p=fract(p*vec2(0.31,0.17));p+=dot(p,p+vec2(1.3,2.1));return fract(p.x*p.y*8.0);}'+
 'void main(){vec2 c=gl_PointCoord-0.5;if(dot(c,c)>0.25)discard;float v=vi;'+
 ' if(u_heavy>0.5){for(int k=0;k<24;k++){v=h(vec2(v,float(k)*0.1+vi));}}'+
 ' gl_FragColor=vec4(0.2+0.3*v,0.5+0.3*fract(vi*3.0),0.6,0.35);}';
/* בדיקת fp16 במספר: שני גיבובים לאותו ריבוע, קוראים פיקסלים ומודדים שונות */
var VS_Q='attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a*2.0-1.0,0.0,1.0);}';
var FS_Q='precision mediump float;varying vec2 v;uniform float u_big;uniform float u_iter;'+
 'float hs(vec2 p){p=fract(p*vec2(0.31,0.17));p+=dot(p,p+vec2(1.3,2.1));return fract(p.x*p.y*8.0);}'+
 'float hb(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}'+
 'void main(){float r=u_big>0.5?hb(v*32.0):hs(v*32.0);'+
 'for(int k=0;k<32;k++){if(float(k)>=u_iter)break;r=hs(vec2(r,v.x+float(k)*0.07));}'+
 'if(u_iter>0.5){gl_FragColor=vec4(r*0.2,r*0.4,0.5,0.25);}else{gl_FragColor=vec4(r,r,r,1.0);}}';
var P_CARD=prog(VS_CARD,FS_CARD), P_PT=prog(VS_PT,FS_PT), P_Q=prog(VS_Q,FS_Q);
var quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,0,1,1,0,1,1]),gl.STATIC_DRAW);
var NPT=300, pts=new Float32Array(NPT*8*2);for(var i=0;i<pts.length;i++)pts[i]=rnd();
var ptb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ptb);gl.bufferData(gl.ARRAY_BUFFER,pts,gl.STATIC_DRAW);
var U=function(p,n){return gl.getUniformLocation(p,n)};
var uc={rect:U(P_CARD,'u_rect'),flip:U(P_CARD,'u_flip'),id:U(P_CARD,'u_id'),face:U(P_CARD,'u_face'),sel:U(P_CARD,'u_sel'),done:U(P_CARD,'u_done')};
var up={t:U(P_PT,'u_t'),asp:U(P_PT,'u_asp'),heavy:U(P_PT,'u_heavy')};
var uq={big:U(P_Q,'u_big'),iter:U(P_Q,'u_iter')};
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

/* ---- hashvar: מודדים פעם אחת בטעינה, בפריים־באפר 32×32 */
var hv={small:-1,big:-1};
function hashVar(big){
  var fb=gl.createFramebuffer(),tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,32,32,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,32,32);gl.useProgram(P_Q);gl.uniform1f(uq.big,big?1:0);gl.uniform1f(uq.iter,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);var a=gl.getAttribLocation(P_Q,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,6);
  var px=new Uint8Array(32*32*4);gl.readPixels(0,0,32,32,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(fb);gl.deleteTexture(tex);
  var n=1024,s=0,s2=0;for(var i=0;i<n;i++){var v=px[i*4]/255;s+=v;s2+=v*v;}
  var m=s/n;return Math.sqrt(Math.max(0,s2/n-m*m));
}
try{hv.small=hashVar(false);hv.big=hashVar(true);}catch(e){glErrors++;}

/* ============================================================ ציור */
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);var r=glc.getBoundingClientRect();W=Math.max(1,Math.floor(r.width*dpr));H=Math.max(1,Math.floor(r.height*dpr));
  glc.width=W;glc.height=H;hud.width=W;hud.height=H;}
window.addEventListener('resize',resize);resize();
var grid={x:0,y:0,s:0,gap:0}; // ריבוע המשחק ביחידות 0..1 של המסך, מחושב כל פריים
function layout(){var pad=0.06;var usable=Math.min(W*(1-2*pad),H*0.52);grid.s=usable/W;grid.gap=0.012;
  grid.x=0.5-grid.s/2;var sy=usable/H;grid.y=0.20;grid.sy=sy;}
function cardRect(i){var cw=(grid.s-grid.gap*3)/4,ch=(grid.sy-grid.gap*3)/4;
  if(i>=16){var b=i-16,bw=(grid.s-grid.gap*2)/3;return[grid.x+b*(bw+grid.gap),1-(grid.y+4*ch+4*grid.gap+ch*0.6),bw,ch*0.6];}
  var c=i%cols,r=Math.floor(i/cols);
  return[grid.x+c*(cw+grid.gap),1-(grid.y+(r+1)*ch+r*grid.gap),cw,ch];}
var ctx=hud.getContext('2d');
function drawHud(f){ctx.clearRect(0,0,W,H);ctx.textBaseline='top';ctx.direction='rtl';
  var fs=Math.round(Math.min(W,H)*0.045);ctx.font='600 '+fs+'px system-ui,sans-serif';ctx.fillStyle='#e8eef2';ctx.textAlign='right';
  ctx.fillText(won?'ניצחת! '+moves+' מהלכים':'זיכרון · זוגות '+matched+'/8 · מהלכים '+moves,W-W*0.06,H*0.06);
  ctx.font=Math.round(fs*0.7)+'px system-ui,sans-serif';ctx.fillStyle='#8a98a4';
  ctx.fillText('חיצים לנווט · OK להפוך · מצב: '+({normal:'רגיל',heavy:'כבד',empty:'ריק'})[MODES[mode]],W-W*0.06,H*0.06+fs*1.4);
  ctx.textAlign='left';ctx.direction='ltr';ctx.font='600 '+Math.round(fs*0.9)+'px ui-monospace,monospace';ctx.fillStyle='#39d0dd';
  ctx.fillText(f.fps.toFixed(0)+' fps · 1% low '+f.low.toFixed(0),W*0.06,H*0.06);
  /* שלושת הכפתורים בשורה התחתונה, נגישים עם החיצים */
  var labels=['מצב: '+({normal:'רגיל',heavy:'כבד',empty:'ריק'})[MODES[mode]],'דווח','חדש'];
  for(var b=0;b<3;b++){var r=cardRect(16+b);var x=r[0]*W,y=(1-r[1]-r[3])*H,w=r[2]*W,h=r[3]*H;
    ctx.fillStyle=cursor===16+b?'#39d0dd':'#1a222b';ctx.fillRect(x,y,w,h);
    ctx.fillStyle=cursor===16+b?'#07090c':'#e8eef2';var bf=Math.round(Math.min(fs*0.6,h*0.5));ctx.font='600 '+bf+'px system-ui,sans-serif';ctx.textAlign='center';ctx.direction='rtl';ctx.textBaseline='middle';
    ctx.fillText(labels[b],x+w/2,y+h/2);ctx.textBaseline='top';}
}
function frame(t){
  if(lastT){var dt=t-lastT;frameTimes.push(dt);if(frameTimes.length>600)frameTimes.shift();if(dt>50)longFrames++;}
  lastT=t;frames++;
  if(frames%60===0){var e=gl.getError();if(e)glErrors++;}
  layout();gl.viewport(0,0,W,H);gl.clearColor(0.03,0.04,0.05,1);gl.clear(gl.COLOR_BUFFER_BIT);
  var m=MODES[mode];
  if(m!=='empty'){
    /* חלקיקים */
    gl.useProgram(P_PT);gl.bindBuffer(gl.ARRAY_BUFFER,ptb);var ap=gl.getAttribLocation(P_PT,'a');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
    gl.uniform1f(up.t,t*0.001);gl.uniform2f(up.asp,W/H,1);gl.uniform1f(up.heavy,m==='heavy'?1:0);
    gl.drawArrays(gl.POINTS,0,m==='heavy'?NPT*8:NPT);
    if(m==='heavy'){gl.useProgram(P_Q);gl.bindBuffer(gl.ARRAY_BUFFER,quad);var aq=gl.getAttribLocation(P_Q,'a');gl.enableVertexAttribArray(aq);gl.vertexAttribPointer(aq,2,gl.FLOAT,false,0,0);
      gl.uniform1f(uq.big,0);gl.uniform1f(uq.iter,24);gl.drawArrays(gl.TRIANGLES,0,6);}
    /* קלפים */
    gl.useProgram(P_CARD);gl.bindBuffer(gl.ARRAY_BUFFER,quad);var ac=gl.getAttribLocation(P_CARD,'a');gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ac,2,gl.FLOAT,false,0,0);
    for(var i=0;i<16;i++){var c=cards[i];c.flip+=(c.target-c.flip)*0.18;var r=cardRect(i);
      gl.uniform4f(uc.rect,r[0],r[1],r[2],r[3]);gl.uniform1f(uc.flip,c.flip);gl.uniform1f(uc.id,c.id);
      gl.uniform1f(uc.face,c.flip>0.5?1:0);gl.uniform1f(uc.sel,cursor===i?1:0);gl.uniform1f(uc.done,c.done?1:0);
      gl.drawArrays(gl.TRIANGLES,0,6);}
  }
  var f=fps();drawHud(f);autoTick(t);
  if(t-lastReport>2000){lastReport=t;if(!finalized){report=line(f);rep.textContent=report;}}
  if(!finalized&&t-lastSend>30000&&frames>120){lastSend=t;send('auto');}
  requestAnimationFrame(frame);
}
function line(f){return 'L · memory-tv · fps='+f.fps.toFixed(1)+' · low1='+f.low.toFixed(1)+' · long='+longFrames+' · frames='+frames+
  ' · err='+glErrors+' · hv_small='+hv.small.toFixed(3)+' · hv_big='+hv.big.toFixed(3)+' · mode='+MODES[mode]+' · mem='+memMB()+
  ' · t='+((performance.now()-started)/1000).toFixed(0)+'s · gl=1 · '+W+'x'+H+(won?' · won moves='+moves:'')+(finalized?' · FINAL':'');}
requestAnimationFrame(frame);

/* ============================================================ משחק וקלט */
function act(){
  if(cursor>=16){var b=cursor-16;
    if(b===0){setMode(MODES[(mode+1)%3]);}
    else if(b===1){finalized=true;report=line(fps());rep.textContent=report;send('button');}
    else {deal();finalized=false;frameTimes=[];longFrames=0;started=performance.now();}
    return;}
  if(lock||won)return;var c=cards[cursor];if(c.done||c.target===1)return;
  c.target=1;open.push(cursor);
  if(open.length===2){moves++;var a=cards[open[0]],b2=cards[open[1]];
    if(a.id===b2.id){a.done=b2.done=true;matched++;open=[];if(matched===8){won=true;finalized=true;report=line(fps());rep.textContent=report;send('won');}}
    else{lock=1;setTimeout(function(){a.target=0;b2.target=0;open=[];lock=0;},700);}
  }
}
function move(dx,dy){if(cursor>=16){var b=cursor-16;if(dy<0){cursor=12+Math.min(3,b+1);return;}if(dy>0)return;b=Math.max(0,Math.min(2,b+dx));cursor=16+b;return;}
  var c=cursor%4,r=Math.floor(cursor/4);c+=dx;r+=dy;if(r>3){cursor=16+Math.min(2,Math.max(0,c-1));return;}
  if(c<0||c>3||r<0)return;cursor=r*4+c;}
var mouseMode=false;
/* טייס אוטומטי (גרסה 13): אם אין קלט ב־12 השניות הראשונות, הדף מודד לבד: רגיל 45 שניות, ריק 20, כבד 20, ומסכם. */
var auto=true, autoPlan=[['normal',45],['empty',20],['heavy',20]], autoIdx=-1, autoStart=0, phases=[];
function setMode(m){mode=MODES.indexOf(m);frameTimes=[];longFrames=0;}
function autoTick(t){
  if(!auto)return;
  if(autoIdx<0){if(t<12000)return;autoIdx=0;autoStart=t;setMode(autoPlan[0][0]);return;}
  var cur=autoPlan[autoIdx],el=(t-autoStart)/1000;
  document.getElementById('sent').textContent='מדידה אוטומטית · '+({normal:'רגיל',empty:'ריק',heavy:'כבד'})[cur[0]]+' · עוד '+Math.max(0,Math.ceil(cur[1]-el))+' שניות';
  if(el>=cur[1]){phases.push(line(fps()));send('auto-'+cur[0]);autoIdx++;
    if(autoIdx>=autoPlan.length){auto=false;finalized=true;report=phases.join('\n');rep.textContent=report;setMode('normal');document.getElementById('sent').textContent='המדידה האוטומטית הסתיימה · 3 שורות';return;}
    autoStart=t;setMode(autoPlan[autoIdx][0]);}
}
window.addEventListener('keydown',function(){auto=false;});
window.addEventListener('pointerdown',function(){auto=false;}); // בטלוויזיה הדפדפן מזיז סמן אדום עם החיצים ו־OK לוחץ. אסור לחטוף את המקשים האלה (גרסה 10 חטפה, והסמן נתקע).
window.addEventListener('keydown',function(e){var k=e.key;if(mouseMode)return;
  if(k==='ArrowLeft')move(-1,0);else if(k==='ArrowRight')move(1,0);else if(k==='ArrowUp')move(0,-1);else if(k==='ArrowDown')move(0,1);
  else if(k==='Enter'||k===' ')act();
  else if(k==='h'||k==='1'){cursor=16;act();}else if(k==='r'||k==='2'){cursor=17;act();}});
glc.style.pointerEvents='auto';
glc.addEventListener('click',function(e){mouseMode=true;var r=glc.getBoundingClientRect();var x=(e.clientX-r.left)/r.width,y=1-(e.clientY-r.top)/r.height;
  for(var i=0;i<19;i++){var q=cardRect(i);
    if(x>=q[0]&&x<=q[0]+q[2]&&y>=q[1]&&y<=q[1]+q[3]){cursor=i;act();return;}}});
document.getElementById('copy').addEventListener('click',function(){var t=rep.textContent;
  try{navigator.clipboard.writeText(t).then(function(){rep.textContent=t+'\n(הועתק)';},function(){var s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(rep);s.removeAllRanges();s.addRange(rg);});}
  catch(e){}});
})();
</script>
