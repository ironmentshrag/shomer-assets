<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>זלמן · מראה חיה</title>
<style>
:root{
  --bg:#0b0c0f; --panel:rgba(14,15,19,.82); --line:rgba(255,255,255,.12); --text:#e9e7e2; --mute:#9a978f;
  --accent:#ff8a3d; --right:#e0564c; --left:#4f8fe6; --mid:#e9c548; --ok:#5ec27a; --bad:#ff5d5d;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0c0f; --panel:rgba(14,15,19,.82); --text:#e9e7e2; } }
:root[data-theme="dark"]{ --bg:#0b0c0f; --panel:rgba(14,15,19,.82); --text:#e9e7e2; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;bottom:var(--stageb,0px)}
body.popen #bar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:16px}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
#brand{font-weight:700;letter-spacing:.02em;font-size:15px;text-shadow:0 1px 3px #000}
#brand small{display:block;font-weight:400;color:var(--mute);font-size:11px}
#stats{font:11px/1.3 ui-monospace,Menlo,monospace;color:var(--mute);text-align:left;direction:ltr;text-shadow:0 1px 2px #000}
#bar{position:fixed;inset-inline:0;bottom:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75) 35%);display:flex;flex-direction:column;gap:8px}
#tl{display:none;position:relative;height:38px;direction:ltr}
#tl input{width:100%;margin:0;position:absolute;top:20px;accent-color:var(--accent)}
#marks{display:none;position:absolute;inset:0 0 auto 0;height:12px;font-size:9px;color:var(--mute);direction:rtl}
#marks span{position:absolute;transform:translateX(50%);white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;min-height:38px;cursor:pointer}
button.on{background:var(--accent);color:#1a0e05;border-color:var(--accent);font-weight:600}
#panel{position:fixed;inset-inline:0;bottom:0;max-height:42vh;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;z-index:5}
#panel.open{transform:none}
#panel header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);gap:8px}
#panel .body{overflow:auto;padding:6px 12px 12px}
#src{width:100%;height:28vh;background:#07080a;color:#e7e3d8;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,Menlo,monospace;direction:rtl;white-space:pre;resize:vertical}
#msg{font-size:12px;margin-top:6px;min-height:1.2em}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
.sl{display:grid;grid-template-columns:7em 1fr 2.8em;gap:6px;align-items:center;margin:0;font-size:11.5px;min-height:26px}
.sl input{width:100%;accent-color:var(--accent);direction:ltr}
.sl output{font:11px ui-monospace,monospace;color:var(--mute);direction:ltr;text-align:left}
.sl.r label{color:var(--right)} .sl.l label{color:var(--left)}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#pip{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 30px);inset-inline-start:12px;width:min(28vw,160px);height:auto;border-radius:12px;border:2px solid rgba(255,255,255,.25);box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:3;background:#000;display:none}
body.live #pip{display:block} body.nopip #pip{display:none}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 22px system-ui;padding:16px 26px;border-radius:16px;background:var(--accent);color:#1a0e05;border:0;z-index:4}
body.live #start{display:none}
#tag{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 4px);inset-inline-start:14px;font-size:12px;color:var(--mute);z-index:3}
#face{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font:600 18px system-ui;color:#ffd2b0;text-shadow:0 1px 4px #000;pointer-events:none}
#cstat{font-size:11px;color:var(--mute)}
#err{position:fixed;left:12px;right:12px;top:40%;background:#3a0f0f;color:#ffd7d7;border:1px solid #ff5d5d;border-radius:12px;padding:12px 14px;font:15px/1.5 system-ui;z-index:6}
body.cam #pip{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div id="hud"><div id="brand"></div><div id="stats"></div></div>
<div id="tag">מראה חיה · הכל בטלפון, שום דבר לא נשלח</div><video id="cam" playsinline muted></video><canvas id="pip"></canvas><div id="face"></div><div id="err" hidden></div><button id="start">▶ פתח מצלמה</button>
<div id="bar">
  <div id="tl"><div id="marks"></div><input id="time" type="range" min="0" max="14" step="0.001" value="0" aria-label="ציר זמן"></div>
  <div class="row">
    <button id="play">⏸</button>
    <button data-lay="skin">עור</button><button data-lay="both" class="on">שניהם</button><button data-lay="anat">שלד</button>
    <button id="ctl">בקרים</button>
    <button id="mus">שרירים</button>
    <button id="cal">כיול</button><button id="pipb">מצלמה</button><button id="mir" class="on">מראה</button><button id="send">יומן ל־Claude</button><span id="cstat"></span><button id="code">קוד</button>
    <label id="exw" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)">הגזמה <input id="exag" type="range" min="1" max="5" step="0.1" value="1" style="width:110px;accent-color:var(--accent);direction:ltr"><output id="exo" style="direction:ltr;min-width:2.4em">×1.0</output></label>
  </div>
</div>
<div id="panel">
  <header><strong id="ptitle"></strong><div class="row"><button id="run" hidden>הרץ ▶</button><button id="pclose">סגור</button></div></header>
  <div class="body"><div id="pbody"></div></div>
</div>

    if (A > 0 && tau < A) return s0 + (va - s0) * mj(tau / A);
    const t2 = tau - A; const from = A > 0 ? va : s0;
    if (t2 < S) return from + (vo - from) * mj(t2 / S);
    const t3 = t2 - S; if (t3 < T) return vo + (vt - vo) * mj(t3 / T);
    return vt;
  }
  return { evalAt, poses: P, says, blinks, gaze, length: L, fps, loop: seq.loop, off };
}

// ---------- GLSL ----------
function f(x) { const s = (+x).toFixed(5); return s.indexOf('.') < 0 ? s + '.0' : s; }
function v3(a) { return 'vec3(' + f(a[0]) + ',' + f(a[1]) + ',' + f(a[2]) + ')'; }

function buildGLSL(C) {
  const NJ = C.joints.length, NM = Math.max(1, C.muscles.length), NB = Math.max(1, C.bends.length), NW = Math.max(1, C.wrinkles.length), NE = Math.max(1, C.eyes.length), NG = C.groups.length;
  const L = [];
  L.push(`#version 300 es
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform int u_layout; uniform float u_quality;
uniform vec3 u_camPos; uniform vec3 u_camAt; uniform float u_fov;
uniform mat3 u_jR[${NJ}]; uniform vec3 u_jO[${NJ}];
uniform vec3 u_mD[${NM}]; uniform float u_bA[${NB}]; uniform float u_wA[${NW}];
uniform vec4 u_eye[${NE}]; uniform vec4 u_mo; uniform vec4 u_mo2;
out vec4 o_col;
vec3 gRest; float gDisp; float gMat; float gEye; vec3 gEyeL;
float smin(float a,float b,float k){ if(k<=0.) return min(a,b); float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*0.25; }
float smax(float a,float b,float k){ return -smin(-a,-b,k); }
float sdEll(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.)/max(k1,1e-6); }
float sdCap(vec3 p, vec3 a, vec3 b, float ra, float rb){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(ra,rb,h); }
float sdTorus(vec3 p, float R, float r){ vec2 q=vec2(length(p.xz)-R,p.y); return length(q)-r; }
vec3 warpM(vec3 q, vec3 c, float r, vec3 D){ vec3 d=q-c; float x=dot(d,d)/(r*r); if(x>=1.) return q; float w=1.-x; return q - D*(w*w*w); }
vec3 bendZ(vec3 q, float y0, float y1, float a){ float w=smoothstep(y0,y1,q.y); float an=-a*w; float c=cos(an), s=sin(an); vec2 d=q.xy-vec2(0.,y0); return vec3(c*d.x-s*d.y, s*d.x+c*d.y+y0, q.z); }
vec3 bendX(vec3 q, float y0, float y1, float a){ float w=smoothstep(y0,y1,q.y); float an=-a*w; float c=cos(an), s=sin(an); vec2 d=q.zy-vec2(0.,y0); return vec3(q.x, s*d.x+c*d.y+y0, c*d.x-s*d.y); }
float h31(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
`);
  // map
  const M = [];
  M.push('vec2 map(vec3 p){');
  // joints
  const childrenOf = {};
  for (let j = 0; j < NJ; j++) {
    const J = C.joints[j]; const par = J.parent < 0 ? 'p' : `q${J.parent}w`;
    M.push(`  vec3 q${j} = u_jR[${j}]*(${par} - u_jO[${j}]);`);
    M.push(`  vec3 q${j}w = q${j};`);
    C.bends.forEach((b, i) => { if (b.joint === j) M.push(`  q${j}w = ${b.axis === 0 ? 'bendX' : 'bendZ'}(q${j}w, ${f(b.y0)}, ${f(b.y1)}, u_bA[${i}]);`); });
    C.muscles.forEach((m, i) => { if (m.joint === j) M.push(`  if(dot(u_mD[${i}],u_mD[${i}])>0.) q${j}w = warpM(q${j}w, ${v3(m.c)}, ${f(m.r)}, u_mD[${i}]);`); });
    void childrenOf;
  }
  const declared = {};
  for (let g = 0; g < NG; g++) M.push(`  float d${g}=1e9; float m${g}=0.; vec3 r${g}=vec3(0); float s${g}=0.;`);
  // bounds per joint: if far, collapse shapes in that joint into bound distance
  const boundOf = {}; for (const b of C.bounds) boundOf[b.joint] = b;
  const shapeExpr = (s) => {
    const q = (s.raw ? `q${s.joint}` : `q${s.joint}w`); const p = s.p;
    if (s.kind === 'כדור') return `length(${q}-${v3(p)})-${f(p[3])}`;
    if (s.kind === 'ביצה') return `sdEll(${q}-${v3(p)}, ${v3(p.slice(3))})`;
    if (s.kind === 'קפסולה') return `sdCap(${q}, ${v3(p)}, ${v3(p.slice(3))}, ${f(p[6])}, ${f(p[7])})`;
    if (s.kind === 'טבעת') return `sdTorus(${q}-${v3(p)}, ${f(p[3])}, ${f(p[4])})`;
  };
  let openBound = -1;
  const closeBound = () => { if (openBound >= 0) { M.push('  } }'); openBound = -1; } };
  const ensureBound = (j) => {
    if (openBound === j) return; closeBound();
    const b = boundOf[j]; if (!b) return;
    const gs = new Set(C.shapes.filter(s => s.joint === j && !s.sub).map(s => s.group));
    M.push(`  { float bd = length(q${j}-${v3(b.c)})-${f(b.r)};`);
    M.push(`  if(bd>0.12){ ${[...gs].map(g => `d${g}=min(d${g},bd);`).join(' ')} } else {`);
    openBound = j;
  };
  const dispOf = j => `length(q${j}-q${j}w)`;
  for (const op of C.ops) {
    if (op.kind === 'shape') {
      const s = op.s; ensureBound(s.joint); const g = s.group;
      if (s.sub) {
        M.push(`  { float d=${shapeExpr(s)}; ${s.mark >= 0 ? `if(-d>d${g}){ m${g}=${f(s.mark)}; }` : ''} d${g}=smax(d${g},-d,${f(s.subk)}); }`);
      } else {
        M.push(`  { float d=${shapeExpr(s)}; if(d<d${g}){ m${g}=${f(s.mat)}; r${g}=q${s.joint}w; s${g}=${dispOf(s.joint)}; } d${g}=smin(d${g},d,${f(s.k)}); }`);
      }
    } else if (op.kind === 'eye') {
      closeBound();
      const e = op.e; const i = C.eyes.indexOf(e); const j = e.joint;
      const gs = C.groupIndex[C.materials[e.matLid].name] != null ? C.groupIndex[C.materials[e.matLid].name] : C.groupIndex['עור'];
      const ge = (C.materials[e.matEye].name in C.groupIndex) ? C.groupIndex[C.materials[e.matEye].name] : (C.groupIndex[C.materials[e.matEye].name] = C.groups.push(C.materials[e.matEye].name) - 1);
      if (ge >= NG && !declared[ge]) (declared[ge] = 1) && M.splice(M.indexOf('vec2 map(vec3 p){') + 1, 0, `  float d${ge}=1e9; float m${ge}=0.; vec3 r${ge}=vec3(0); float s${ge}=0.;`);
      const ct = Math.cos(e.tilt), sn = Math.sin(e.tilt);
      M.push(`  { vec3 e=q${j}-${v3(e.c)}; vec3 ew=q${j}w-${v3(e.c)};
    float bd=length(e)-${f(e.r + 0.06)};
    if(bd<0.08){
    float ds=length(ew)-${f(e.r + 0.004)}; d${gs}=smax(d${gs},-ds,0.018);
    float db=length(e)-${f(e.r)}; if(db<d${ge}){ d${ge}=db; m${ge}=${f(e.matEye)}; r${ge}=e; gEye=${f(i)}; }
    vec3 l=ew; l.xy=mat2(${f(ct)},${f(sn)},${f(-sn)},${f(ct)})*l.xy;
    float sh=abs(length(l)-${f(e.r + 0.014)})-${f(0.0095)};
    float au=u_eye[${i}].z, al=u_eye[${i}].w;
    float du=smax(sh,-dot(l,vec3(0.,cos(au),-sin(au))),0.008);
    float dl=smax(sh, dot(l,vec3(0.,cos(al),-sin(al))),0.008);
    float dlid=min(du,dl); if(dlid<d${gs}){ m${gs}=${f(e.matLid)}; r${gs}=q${j}w; s${gs}=${dispOf(j)}; }
    d${gs}=smin(d${gs},dlid,0.014);
    } else { d${ge}=min(d${ge},bd); } }`);
    } else if (op.kind === 'mouth') {
      closeBound();
      const m = C.mouth; const j = m.joint, jj = m.jaw; const c = m.c; const W = m.w;
      const gs = C.groupIndex['עור'];
      const gt = C.groupIndex['__teeth'] != null ? C.groupIndex['__teeth'] : (C.groupIndex['__teeth'] = C.groups.push('__teeth') - 1);
      M.splice(M.indexOf('vec2 map(vec3 p){') + 1, 0, `  float d${gt}=1e9; float m${gt}=0.; vec3 r${gt}=vec3(0); float s${gt}=0.;`);
      // jaw-space mouth centre: transform c from parent joint into jaw rest space
      const J = C.joints[jj]; const lc = [c[0] - J.origin[0], c[1] - J.origin[1], c[2] - J.origin[2]];
      M.push(`  { float open=u_mo.x; float wf=1.+0.22*u_mo.y-0.55*u_mo.z; float press=u_mo.w; float teeth=u_mo2.x;
    vec3 mq=q${j}w-${v3(c)};
    float bd=length(mq*vec3(1.,1.2,1.))-${f(W * 1.6)};
    if(bd<0.1){
    float cs=(mq.x<0.?u_mo2.z:u_mo2.w); float crv=cs*(cs>0.?1.9:1.05)*mq.x*mq.x; vec3 cp=mq-vec3(0.,-0.07*open+crv,-0.035);
    float dc=sdEll(cp, vec3(${f(W * 0.44)}*wf, 0.004+0.095*open+0.02*teeth*open, ${f(W * 0.5)}));
    if(-dc>d${gs}){ m${gs}=${f(m.matIn)}; r${gs}=q${j}w; }
    d${gs}=smax(d${gs},-dc,0.014);
    vec3 up=mq-vec3(0., 0.017+0.016*teeth+crv, -0.006+0.05*u_mo.z); up.z+=up.x*up.x*2.4;
    float du=sdEll(up, vec3(${f(W * 0.5)}*wf, 0.019-0.007*press, 0.026+0.012*u_mo.z));
    vec3 lq=q${jj}w-${v3(lc)};
    float cl=(lq.x<0.?u_mo2.z:u_mo2.w); float crl=cl*(cl>0.?1.6:0.9)*lq.x*lq.x; vec3 lp=lq-vec3(0., -0.019-0.016*teeth+crl, -0.008+0.05*u_mo.z); lp.z+=lp.x*lp.x*2.4;
    float dl=sdEll(lp, vec3(${f(W * 0.47)}*wf, 0.023-0.008*press, 0.029+0.012*u_mo.z));
    float dlip=min(du,dl);
    if(dlip<d${gs}){ m${gs}=${f(m.matLip)}; r${gs}=q${j}w; s${gs}=${dispOf(j)}; }
    d${gs}=smin(d${gs},dlip,0.03);
    vec3 tp=q${j}w-${v3([c[0], c[1] + 0.006, c[2] - 0.085])};
    float ang=atan(tp.x,tp.z); float rr=length(tp.xz)-0.083;
    float dt=max(max(abs(rr)-0.011, abs(tp.y)-0.019), abs(ang)-0.95)-0.003;
    dt+=0.0035*smoothstep(0.82,1.0,abs(cos(ang*8.5)));
    vec3 bp=lq-vec3(0.,-0.014,-0.09);
    float angb=atan(bp.x,bp.z); float rb=length(bp.xz)-0.076;
    float db=max(max(abs(rb)-0.010, abs(bp.y)-0.016), abs(angb)-0.9)-0.003;
    db+=0.003*smoothstep(0.8,1.0,abs(cos(angb*9.5)));
    float dtt=min(dt,db); if(dtt<d${gt}){ d${gt}=dtt; m${gt}=${f(m.matTooth)}; r${gt}=tp; }
    float tg=u_mo2.y; vec3 gq=lq-vec3(0.,-0.042-0.014*tg,-0.075+0.14*tg);
    gq.y+=0.9*tg*max(gq.z,0.)*max(gq.z,0.);              /* tip curls down a little as it leaves the mouth */
    float dg=sdEll(gq, vec3(0.062-0.010*tg,0.026-0.002*tg,0.08+0.045*tg));
    dg+=0.004*tg*exp(-gq.x*gq.x*1600.)*step(-0.02,gq.y);   /* midline groove on top */
    if(dg<d${gt}){ d${gt}=dg; m${gt}=${f(m.matTongue)}; r${gt}=lq; }
    } }`);
    }
  }
  closeBound();
  // wrinkles
  C.wrinkles.forEach((w, i) => {
    const ax = ['x', 'y', 'z'][w.axis];
    M.push(`  { vec3 wq=q${w.joint}w-${v3(w.c)}; vec3 rr=wq/${v3(w.r)}; float x=dot(rr,rr); if(x<1.&&u_wA[${i}]>0.){ float mk=(1.-x)*(1.-x);
    float ph=wq.${ax}+0.012*sin(wq.${ax === 'x' ? 'y' : 'x'}*23.+${f(i * 1.7)});
    float s=abs(sin(ph*${f(w.f)})); float gr=pow(1.-s,5.);
    d${w.group}+=u_wA[${i}]*${f(w.depth)}*mk*gr; } }`);
  });
  // combine groups
  M.push('  float d=1e9; float mm=0.; vec3 rr=vec3(0); float ss=0.;');
  for (let g = 0; g < C.groups.length; g++) M.push(`  if(d${g}<d){ d=d${g}; mm=m${g}; rr=r${g}; ss=s${g}; }`);
  M.push('  gRest=rr; gDisp=ss; gMat=mm; return vec2(d,mm);');
  M.push('}');
  L.push(M.join('\n'));

  // materials & shading
  const mats = C.materials;
  const matArr = (key) => `vec3[${mats.length}](${mats.map(m => v3(m[key])).join(',')})`;
  L.push(`
const vec3 MCOL[${mats.length}] = ${matArr('col')};
const vec3 MSSS[${mats.length}] = ${matArr('sss')};
const vec3 MCOL2[${mats.length}] = ${matArr('col2')};
const float MGLOSS[${mats.length}] = float[${mats.length}](${mats.map(m => f(m.gloss)).join(',')});
const int MTYPE[${mats.length}] = int[${mats.length}](${mats.map(m => m.type).join(',')});
const vec3 IRIS[${NE}] = vec3[${NE}](${(C.eyes.length ? C.eyes : [{ iris: [0.3, 0.4, 0.5] }]).map(e => v3(e.iris)).join(',')});
const int NL=${C.lights.length};
const vec3 LDIR[${C.lights.length}] = vec3[${C.lights.length}](${C.lights.map(l => { const n = Math.hypot(...l.dir); return v3(l.dir.map(x => x / n)); }).join(',')});
const vec3 LCOL[${C.lights.length}] = vec3[${C.lights.length}](${C.lights.map(l => v3(l.col)).join(',')});
const bool LSH[${C.lights.length}] = bool[${C.lights.length}](${C.lights.map(l => l.shadow ? 'true' : 'false').join(',')});
const vec3 BG0=${v3(C.bg.slice(0, 3))}; const vec3 BG1=${v3(C.bg.slice(3, 6))};
`);
  // flush function (redness map) in head joint space of rest coords
  L.push(`float flush(vec3 r){ float a=0.; ${C.flush.map(fl => `{ vec3 d=r-${v3(fl.c)}; a+=${f(fl.a)}*exp(-dot(d,d)/${f(fl.r * fl.r)}); }`).join(' ')} return a; }`);
  L.push(`
vec3 nrm(vec3 p, float t){ vec2 e=vec2(1.,-1.)*(0.0009+0.0006*t*0.2);
  return normalize(e.xyy*map(p+e.xyy).x + e.yyx*map(p+e.yyx).x + e.yxy*map(p+e.yxy).x + e.xxx*map(p+e.xxx).x); }
float shadow(vec3 ro, vec3 rd){ float res=1.; float t=0.012; for(int i=0;i<28;i++){ float h=map(ro+rd*t).x; res=min(res, 10.*h/t); t+=clamp(h,0.012,0.12); if(res<0.02||t>2.2) break; } return clamp(res,0.,1.); }
float ao(vec3 p, vec3 n){ float o=0., s=1.; for(int i=1;i<=5;i++){ float h=0.012+0.035*float(i); o+=(h-map(p+n*h).x)*s; s*=0.7; } return clamp(1.-2.2*o,0.,1.); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }

vec3 shadeSkin(int mi, vec3 p, vec3 n, vec3 rd, vec3 rest, float disp, float occ, bool full){
  vec3 base=MCOL[mi]; int ty=MTYPE[mi];
  vec3 v=-rd; vec3 col=vec3(0.);
  // micro surface: pores / strands / weave in rest space so they stick to the skin
  vec3 nn=n;
  float gl=MGLOSS[mi];
  if(full){
    if(ty==0||ty==1){ float s=ty==0?140.:220.; vec3 g=vec3(vnoise(rest*s+vec3(0.1,0,0))-vnoise(rest*s-vec3(0.1,0,0)), vnoise(rest*s+vec3(0,0.1,0))-vnoise(rest*s-vec3(0,0.1,0)), vnoise(rest*s+vec3(0,0,0.1))-vnoise(rest*s-vec3(0,0,0.1)));
      nn=normalize(n+g*(ty==0?0.55:0.35));
      float mott=vnoise(rest*9.)*0.6+vnoise(rest*31.)*0.4; base*=0.9+0.2*mott;
      base=mix(base, MCOL2[mi], clamp(flush(rest),0.,1.));
      if(ty==0){ float sp=smoothstep(0.80,0.86,vnoise(rest*22.+3.))*smoothstep(0.70,0.88,rest.y); base=mix(base, base*vec3(0.8,0.64,0.52), sp*0.45); } }
    if(ty==6){ vec3 hs=vec3(rest.x*14.,rest.y*300.,rest.z*300.); float st=vnoise(hs); float st2=vnoise(hs*vec3(1.,2.3,2.3)+7.); base*=0.45+0.75*st*0.7+0.3*st2; nn=normalize(n+vec3(0.,st-0.5,st2-0.5)*0.5); }
    if(ty==7){ float wv=sin(rest.x*900.)*sin(rest.y*900.); base*=0.93+0.07*wv; }
  }
  for(int i=0;i<NL;i++){
    vec3 l=LDIR[i]; float ndl=dot(nn,l);
    float sh=1.; if(LSH[i]&&full) sh=shadow(p+n*0.004,l);
    float wrap=(ty==0||ty==1||ty==4)?0.45:0.1;
    float dif=max(0.,(ndl+wrap)/(1.+wrap));
    vec3 sss=MSSS[mi]*smoothstep(-0.35,0.15,ndl)*(1.-smoothstep(0.15,0.8,ndl))*0.55;
    vec3 h=normalize(l+v); float nh=max(dot(nn,h),0.);
    float fres=0.04+0.96*pow(1.-max(dot(nn,v),0.),5.);
    float sp;
    if(ty==6){ vec3 tng=normalize(cross(nn,vec3(0,1,0))); float th=dot(tng,h); sp=pow(sqrt(max(1.-th*th,0.)),60.)*0.35; }
    else if(ty==8){ vec3 tng=normalize(cross(nn,vec3(1,0,0))); float th=dot(tng,h); sp=pow(sqrt(max(1.-th*th,0.)),40.)*0.22; }
    else sp=pow(nh, 8.+gl*120.)*(0.2+gl*1.6)*fres*4.;
    col+=LCOL[i]*sh*(base*dif + sss*base*2.0 + vec3(sp)*smoothstep(0.,0.2,ndl));
  }
  // hemisphere ambient
  vec3 amb=mix(BG0*1.6, BG1*2.2+vec3(0.06), 0.5+0.5*nn.y);
  col+=base*amb*occ*0.42;
  if(ty==5){ col=base*(0.25+0.75*occ)*0.6; }
  return col;
}

vec3 shadeEye(int ei, vec3 p, vec3 n, vec3 rd, vec3 e, float occ, bool full){
  vec4 E=u_eye[ei];
  float yaw=E.x, pit=E.y;
  vec3 dir=vec3(sin(yaw)*cos(pit), sin(pit), cos(yaw)*cos(pit));
  vec3 en=normalize(e);
  float ang=acos(clamp(dot(en,dir),-1.,1.));
  vec3 side=normalize(cross(dir,vec3(0,1,0))); vec3 upv=cross(side,dir);
  float phi=atan(dot(en,upv),dot(en,side));
  vec3 sclera=vec3(0.86,0.83,0.80);
  if(full) sclera=mix(sclera, vec3(0.8,0.45,0.42), smoothstep(0.75,1.5,ang)*0.35*vnoise(vec3(phi*7.,ang*20.,0.)));
  vec3 iris=IRIS[ei];
  float fib=vnoise(vec3(phi*18.,ang*30.,1.))*0.6+vnoise(vec3(phi*45.,ang*10.,2.))*0.4;
  vec3 ic=iris*(0.55+0.9*fib); ic=mix(ic, iris*1.5+vec3(0.10,0.07,0.01), smoothstep(0.36,0.2,ang)*0.6);
  float pr=0.19;
  vec3 col=sclera;
  col=mix(col, ic, smoothstep(0.58,0.55,ang));
  col=mix(col, ic*0.3, smoothstep(0.47,0.57,ang)*smoothstep(0.59,0.56,ang)); // limbal ring
  col=mix(col, vec3(0.012), smoothstep(pr+0.015,pr,ang));
  // lighting with cornea
  vec3 v=-rd; vec3 lit=vec3(0.);
  for(int i=0;i<NL;i++){ vec3 l=LDIR[i]; float sh=1.; if(LSH[i]&&full) sh=shadow(p+n*0.004,l);
    lit+=LCOL[i]*sh*(col*max(dot(n,l),0.)*0.9);
    vec3 cn=normalize(mix(n, dir, 0.35*smoothstep(0.6,0.3,ang)));
    lit+=LCOL[i]*sh*pow(max(dot(reflect(-l,cn),v),0.),160.)*1.6; }
  lit+=col*mix(BG0*1.6,BG1*2.2+vec3(0.06),0.5+0.5*n.y)*occ*0.5;
  return lit*mix(0.35,1.,occ);
}

  const W=160,H=180; cv.style.width=W+'px'; cv.style.height=H+'px'; cv.width=W; cv.height=H; gl.viewport(0,0,W,H); gl.useProgram(prog);
  const px=new Uint8Array(W*H*4); let prev=null; const diffs=[]; const N=Math.round(C.timeline.length*C.seq.fps);

// ===== לייב: המצלמה → קורא פנים (בדפדפן) → שרירי זלמן → ציור. הכל בטלפון, שום דבר לא נשלח =====
const CAL = JSON.parse(document.getElementById('calib').textContent);   // טווחים שנמדדו מהסרטון של איירון (22/10/2026)

const idx = {}; C.channels.forEach((n, i) => idx[n] = i);

const clampN = (x, a, b) => Math.max(a, Math.min(b, x));
const nz = (v, k) => { const [lo, hi] = CAL.nz[k]; return clampN((v - lo) / Math.max(hi - lo, 1e-3), 0, 1.2); };

// תרגום 52 מדדי ההבעה + נקודות הפנים לערוצי שריר. אותה מפה כמו track.py (הקובץ שבנה את "איירון בתור זלמן")
function retarget(bs, L, out) {

  const set = (n, v) => { const i = idx[n]; if (i != null) out[i] = v; };
  // מראה: הצד הימני של זלמן = הצד השמאלי בתמונת המצלמה (המודל מדבר על צד הנבדק)
  set('גבה_פנים_י', nz(b('browInnerUp'), 'browInnerUp')); set('גבה_פנים_ש', nz(b('browInnerUp'), 'browInnerUp'));
  set('גבה_חוץ_י', nz(b('browOuterUpRight'), 'browOuterUpRight')); set('גבה_חוץ_ש', nz(b('browOuterUpLeft'), 'browOuterUpLeft'));
  set('כיווץ_י', nz(b('browDownRight'), 'browDownRight')); set('כיווץ_ש', nz(b('browDownLeft'), 'browDownLeft'));
  set('לחי_הרמה_י', nz(b('cheekSquintRight'), 'cheekSquintRight')); set('לחי_הרמה_ש', nz(b('cheekSquintLeft'), 'cheekSquintLeft'));
  set('חיוך_י', nz(b('mouthSmileRight'), 'mouthSmileRight')); set('חיוך_ש', nz(b('mouthSmileLeft'), 'mouthSmileLeft'));
  set('עצב_י', nz(b('mouthFrownRight'), 'mouthFrownRight')); set('עצב_ש', nz(b('mouthFrownLeft'), 'mouthFrownLeft'));
  set('נחירה_י', nz(b('noseSneerRight'), 'noseSneerRight')); set('נחירה_ש', nz(b('noseSneerLeft'), 'noseSneerLeft'));
  set('קימוט_אף', nz((b('noseSneerRight') + b('noseSneerLeft')) / 2, 'noseSneerLeft'));
  set('סנטר', nz(b('mouthShrugLower'), 'mouthShrugLower'));
  set('פתיחה', Math.max(op, nz(b('jawOpen'), 'jawOpen')));
  set('מתיחה', clampN(clampN(wd, 0, 1.2) - 0.6 * clampN(nr, 0, 1), -0.6, 1));
  set('עיגול', clampN(Math.max(nz(Math.max(b('mouthPucker'), b('mouthFunnel')), 'mouthPucker'), clampN(nr, 0, 1)), 0, 1));
  set('לחץ', nz(b('mouthPressLeft') / 2 + b('mouthPressRight') / 2 + b('mouthRollLower') * 0.5 + b('mouthClose') * 0.5, 'mouthPressLeft'));
  set('שיניים', nz((b('mouthUpperUpLeft') + b('mouthUpperUpRight')) / 2, 'mouthUpperUpLeft'));
  set('עפעף_עליון_י', nz(b('eyeWideRight'), 'eyeWideRight') - 1.1 * clampN(br - both, 0, 1) - 0.15 * sqR);
  set('עפעף_עליון_ש', nz(b('eyeWideLeft'), 'eyeWideLeft') - 1.1 * clampN(bl - both, 0, 1) - 0.15 * sqL);
  set('עפעף_תחתון_י', 0.7 * sqR); set('עפעף_תחתון_ש', 0.7 * sqL);

  set('מבט_x', 0.35 * ((b('eyeLookOutLeft') + b('eyeLookInRight')) / 2 - (b('eyeLookInLeft') + b('eyeLookOutRight')) / 2));
  set('מבט_y', 0.3 * ((b('eyeLookUpLeft') + b('eyeLookUpRight')) / 2 - (b('eyeLookDownLeft') + b('eyeLookDownRight')) / 2));
}
function headPose(M, out) { // מטריצת תנוחת הראש → זוויות, יחסית לתנוחת הכיול
  if (!M) return; const R = M.data || M; // 4x4 column-major
  const yaw = Math.atan2(R[8], R[10]), pitch = Math.asin(-clampN(R[9], -1, 1)), roll = Math.atan2(R[4], R[5]);
  const b = baseline ? baseline.head : [0, 0, 0];
  const set = (n, v) => { const i = idx[n]; if (i != null) out[i] = v; };
  set('ראש_y', (yaw - b[0]) / 0.45); set('ראש_x', (pitch - b[1]) / 0.35); set('ראש_z', (roll - b[2]) / 0.30);
}
// לשון: אדמומיות מתחת לשפה התחתונה מול הלחי, רק כשהפה פתוח (אין לזה מדד במודל)
function tongue(L, open, round) {
  const W = pipc.width, H = pipc.height; if (!W) return 0;
  const iod = d2(L[33], L[263]) * W; const r = Math.max(3, Math.round(0.08 * iod));
  const patch = (p, dy) => { const x = Math.round(p.x * W - r), y = Math.round(p.y * H + dy - r); if (x < 0 || y < 0 || x + 2 * r > W || y + 2 * r > H) return null; const d = pctx.getImageData(x, y, 2 * r, 2 * r).data; let s = 0, n = 0; for (let i = 0; i < d.length; i += 4) { s += (d[i] - d[i + 1]) / (d[i] + d[i + 1] + d[i + 2] + 1); n++; } return s / n; };
  const a = patch(L[17], 0.12 * iod), c = patch(L[205], 0);

const liveVec = new Float32Array(C.channels.length);
const PAIRS = C.channels.map((n, i) => n.endsWith('_י') && idx[n.slice(0, -2) + '_ש'] != null ? [i, idx[n.slice(0, -2) + '_ש']] : null).filter(Boolean);
const FLIP = ['ראש_y', 'ראש_z', 'מבט_x'].map(n => idx[n]).filter(i => i != null);
mocap = (chv) => { if (!haveSm) return; for (let i = 0; i < chv.length; i++) if (live[i] != null) chv[i] = sm[i]; };
async function loadModel() {
  $('cstat').textContent = 'טוען את קורא הפנים…';
  const { FaceLandmarker, FilesetResolver } = await import('./mp/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks('./mp/wasm');
  const mk = delegate => FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: './face.task', delegate }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
  try { lm = await mk('GPU'); $('cstat').textContent = 'קורא פנים: GPU'; } catch (e) { lm = await mk('CPU'); $('cstat').textContent = 'קורא פנים: CPU'; }
}
async function startCam() {
  const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  vid.srcObject = st; await vid.play();
  pipc.width = 160; pipc.height = Math.round(160 * vid.videoHeight / vid.videoWidth) || 120;
}
function calibrate() { calFrames = []; calUntil = performance.now() + 1500; baseline = null; $('cstat').textContent = 'כיול: פנים רגילות, 1.5 שניות…'; }
function finishCal() {
  const keys = ['eyeBlinkLeft', 'eyeBlinkRight', 'eyeSquintLeft', 'eyeSquintRight']; const bs = {};
  for (const k of keys) { const v = calFrames.map(f => f.bs[k] || 0).sort((a, b) => a - b); bs[k] = v[Math.floor(v.length / 2)]; }
  const mws = calFrames.map(f => f.mw).sort((a, b) => a - b); const heads = [0, 1, 2].map(j => { const v = calFrames.map(f => f.head[j]).sort((a, b) => a - b); return v[Math.floor(v.length / 2)]; });
  baseline = { bs, mw: mws[Math.floor(mws.length / 2)], head: heads }; LS.set('zalman_live_cal', JSON.stringify(baseline));
  $('cstat').textContent = 'כויל ✓';
}
function tick() {
  if (!running) return;
  const ts = performance.now();
  if (vid.readyState >= 2 && lm) {
    pctx.save(); if (mirror) { pctx.translate(pipc.width, 0); pctx.scale(-1, 1); } pctx.drawImage(vid, 0, 0, pipc.width, pipc.height); pctx.restore();
    const t0 = performance.now(); const r = lm.detectForVideo(vid, Math.round(ts)); detMs = detMs * 0.9 + (performance.now() - t0) * 0.1; nDet++;
    if (r && r.faceLandmarks && r.faceLandmarks.length) {
      const L = r.faceLandmarks[0]; const bs = {}; for (const c of r.faceBlendshapes[0].categories) bs[c.categoryName] = c.score;
      const M = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
      if (calUntil > ts) { const iod = d2(L[33], L[263]) || 1e-3; const R = M ? (M.data || M) : null; calFrames.push({ bs, mw: d2(L[61], L[291]) / iod, head: R ? [Math.atan2(R[8], R[10]), Math.asin(-clampN(R[9], -1, 1)), Math.atan2(R[4], R[5])] : [0, 0, 0] }); }
      else if (calUntil && !baseline && calFrames.length) { finishCal(); calUntil = 0; }
      live = live || new Array(C.channels.length).fill(null);
      liveVec.fill(0); retarget(bs, L, liveVec); headPose(M, liveVec);
      if (mirror) { for (const p of PAIRS) { const t = liveVec[p[0]]; liveVec[p[0]] = liveVec[p[1]]; liveVec[p[1]] = t; } for (const i of FLIP) liveVec[i] = -liveVec[i]; }   // מראה: הצד שלך מול הצד שלו
      const tg = tongue(mirror ? L.map(p => ({ x: 1 - p.x, y: p.y })) : L, liveVec[idx['פתיחה']] || 0, liveVec[idx['עיגול']] || 0); if (idx['לשון'] != null) liveVec[idx['לשון']] = tg;

}
// שלבים גלויים ושגיאה שלא נמחקת: כל שלב כותב על הכפתור עצמו
const step = t => { $('start').textContent = t; $('cstat').textContent = t; };
const fail = (where, e) => { const n = (e && e.name) || '', m = (e && e.message) || String(e);
  const why = n === 'NotAllowedError' ? 'הדפדפן לא קיבל אישור למצלמה. בכרום: מנעול ליד הכתובת ← הרשאות ← מצלמה ← אפשר, ואז לרענן.'
    : n === 'NotFoundError' ? 'לא נמצאה מצלמה במכשיר.' : n === 'NotReadableError' ? 'המצלמה תפוסה באפליקציה אחרת. לסגור אותה ולנסות שוב.'
    : !navigator.mediaDevices ? 'הדף לא נפתח בכתובת מאובטחת (https), ולכן אין גישה למצלמה.' : '';

const LOG = [], REC = [];
$('start').onclick = async () => {

  try { running = true; document.body.classList.add('live'); tick(); const saved = LS.get('zalman_live_cal'); if (saved) { try { baseline = JSON.parse(saved); $('cstat').textContent = 'כיול קודם נטען'; } catch (e) {} } else calibrate(); if (!playing) { playing = true; $('play').textContent = '⏸'; requestAnimationFrame(frame); } }
  catch (e) { fail('ההפעלה', e); }

$('send').onclick = () => {
  const blob = new Blob([JSON.stringify({ at: new Date().toISOString(), ua: navigator.userAgent, baseline, detMs: Math.round(detMs), log: LOG, channels: C.channels, rec: REC.slice(-1800) })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zalman-live-' + Date.now() + '.json'; document.body.append(a); a.click(); a.remove();
};
