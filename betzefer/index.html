<script>// ===== GLSL: all written by hand, no libraries =====
const GLSL_COMMON = `
uniform vec3 uSunDir;
uniform float uTime;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+7.1; a*=.5; } return s; }
vec3 skyColor(vec3 d){
  float e=d.y;
  vec2 sh=normalize(uSunDir.xz); vec2 dh=normalize(d.xz+1e-5);
  float az=dot(sh,dh)*.5+.5;
  float sd=max(dot(d,uSunDir),0.);
  vec3 zen=vec3(.085,.22,.50);
  vec3 mid=mix(vec3(.34,.46,.62),vec3(.95,.60,.20),az*az);
  vec3 hor=mix(vec3(.55,.44,.46),vec3(1.35,.42,.05),pow(az,1.5));
  float t=clamp(e,0.,1.);
  vec3 c=mix(hor,mid,smoothstep(0.,.16,t));
  c=mix(c,zen,smoothstep(.07,.50,t));
  c+=vec3(1.3,.50,.10)*pow(sd,14.)*.35;
  c+=vec3(1.6,.8,.25)*pow(sd,160.)*1.6;
  c+=vec3(9.,5.6,2.2)*smoothstep(.99955,.99985,sd);
  // thin high clouds lit from below
  if(e>0.){ vec2 cp=d.xz/(e+.12)*1.2; float cl=fbm(cp*vec2(.5,1.6)+3.)*fbm(cp*.35+11.);
    cl=smoothstep(.20,.42,cl)*smoothstep(0.,.10,e)*.55;
    c=mix(c,mix(vec3(.55,.40,.42),vec3(1.5,.70,.28),az*az),cl); }
  if(e<0.) c=mix(hor*.55,vec3(.05,.07,.10),smoothstep(0.,-.25,e));
  return c;
}
`;

const VS_MAIN = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNor; layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aCol; layout(location=4) in vec2 aInfo;
uniform mat4 uVP; uniform mat4 uM;
out vec3 vW; out vec3 vO; out vec3 vN; out vec2 vUV; out vec3 vC; out vec2 vInfo;
void main(){ vec4 w=uM*vec4(aPos,1.); vW=w.xyz; vO=aPos; vN=mat3(uM)*aNor; vUV=aUV; vC=aCol; vInfo=aInfo; gl_Position=uVP*w; }
`;

const FS_MAIN = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vW; in vec3 vO; in vec3 vN; in vec2 vUV; in vec3 vC; in vec2 vInfo;
uniform vec3 uCam; uniform sampler2D uAtlas; uniform sampler2DShadow uShadow; uniform mat4 uSunVP;
uniform sampler2D uLogo; uniform vec4 uScrRect; uniform vec4 uLogoBox; uniform vec2 uScr;
uniform vec4 uLP[8]; uniform vec3 uLC[8]; uniform float uLDR; uniform float uExp; uniform float uFlat; uniform float uLightsOn;
${GLSL_COMMON}
out vec4 o;
const float PI=3.14159265;
float D_GGX(float nh,float a){ float a2=a*a; float d=nh*nh*(a2-1.)+1.; return a2/(PI*d*d+1e-5); }
float V_Sm(float nv,float nl,float a){ float k=a*.5+.02; return 1./((nv*(1.-k)+k)*(nl*(1.-k)+k)*4.+1e-4); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  int m=int(vInfo.x+.5); float indoor=vInfo.y;
  vec3 N=normalize(vN); vec3 V=normalize(uCam-vW); if(dot(N,V)<0.) N=-N;
  vec3 alb=vC; float rough=.7; float metal=0.; vec3 emis=vec3(0.); float ao=1.;
  vec3 P=vO; float dist=length(uCam-vW);
  if(uFlat<.5){
  if(m==0){ // exterior plaster
    float n=fbm(P.zy*1.7)+fbm(P.zy*9.)*.3; alb=vec3(.80,.79,.75)*(.80+.25*n);
    float streak=fbm(vec2(P.z*6.,P.y*.5)); alb*=mix(1.,.82,smoothstep(.55,.8,streak)*smoothstep(6.,2.,P.y));
    alb*=mix(.72,1.,smoothstep(0.,.5,P.y)); rough=.92;
  } else if(m==1){ // interlocking pavers
    vec2 p=vW.xz; float fw=max(fwidth(p.x),fwidth(p.y));
    float row=floor(p.x/.1); vec2 q=vec2(p.y/.2+mod(row,2.)*.5,p.x/.1); vec2 id=floor(q); vec2 f=fract(q);
    float h=hash21(id); vec2 bid=floor(p/1.2); float hb=hash21(bid+7.);
    vec3 a=mix(vec3(.36,.34,.31),vec3(.50,.45,.38),h); a=mix(a,vec3(.27,.26,.25),step(.82,hb)*.75);
    float e=min(min(f.x,1.-f.x)*.2,min(f.y,1.-f.y)*.1); float g=smoothstep(0.,.006+fw,e);
    float fade=smoothstep(.02,.12,fw);
    vec3 flatc=vec3(.40,.37,.33);
    alb=mix(mix(vec3(.13,.12,.11),a,g),flatc,fade);
    alb*=.82+.3*fbm(p*.6); rough=mix(.42+.25*h,.55,fade);
    N=normalize(N+vec3(h-.5,0.,hash21(id+3.)-.5)*.07*(1.-fade));
  } else if(m==2){ alb=vec3(.045,.05,.055); rough=.38; metal=.85;
  } else if(m==4){ // parquet
    vec2 p=vW.xz; float fw=max(fwidth(p.x),fwidth(p.y));
    float row=floor(p.y/.07); vec2 q=vec2(p.x/.5+hash21(vec2(row,3.)),p.y/.07); vec2 id=floor(q); vec2 f=fract(q);
    float h=hash21(id);
    vec3 a=mix(vec3(.095,.055,.034),vec3(.19,.115,.066),h);
    float gr=fbm(vec2(p.x*3.+h*20.,p.y*70.)); a*=.72+.5*gr;
    float e=min(min(f.x,1.-f.x)*.5,min(f.y,1.-f.y)*.07); float g=smoothstep(0.,.002+fw,e);
    float fade=smoothstep(.01,.08,fw);
    alb=mix(a*mix(.35,1.,g),vec3(.15,.085,.045),fade); rough=mix(.13+.14*gr,.2,fade);
  } else if(m==5){ float n=fbm(P.xz*3.+P.y*2.7); alb=vec3(.86,.75,.55)*(.9+.14*n); rough=.85;
  } else if(m==6){ float br=vnoise(vec2(P.x*3.+P.z*3.,P.y*260.)); alb=vec3(.72,.74,.76)*(.8+.25*br); rough=.30+.15*br; metal=.9;
  } else if(m==7){ // light wood
    vec3 q=P*vec3(1.,1.,1.); float ax=abs(vN.y)>.5?1.:0.;
    vec2 uv=ax>.5?P.xz:vec2(P.x+P.z,P.y);
    float gr=fbm(vec2(uv.x*1.5,uv.y*38.)+fbm(uv*3.)*2.); alb=mix(vec3(.50,.31,.14),vec3(.74,.53,.28),gr)*vC; rough=.5;
  } else if(m==8){ // acoustic ceiling
    vec2 p=vW.xz; float fw=max(fwidth(p.x),fwidth(p.y));
    vec2 t=fract(p/.6); float edge=min(min(t.x,1.-t.x),min(t.y,1.-t.y))*.6; float seam=smoothstep(0.,.006+fw,edge);
    vec2 d=fract(p/.03)-.5; float dot_=smoothstep(.10,.16,length(d)); float fade=smoothstep(.004,.02,fw);
    float perf=mix(dot_,.9,fade); float inner=step(.06,edge);
    alb=vec3(.86,.85,.82)*mix(.6,1.,seam)*mix(1.,perf,inner*vC.x); rough=.95;
  } else if(m==9){ alb=vec3(.86,.60,.06); rough=.6;
  } else if(m==10){ vec4 t=texture(uAtlas,vUV); alb=t.rgb; rough=.45;
  } else if(m==18){ // projection screen: matte grey when off, glowing white when lit, then the logo
    vec2 lu=(vUV-uScrRect.xy)/(uScrRect.zw-uScrRect.xy); vec3 sc=vec3(1.);
    vec2 q=(lu-uLogoBox.xy)/(uLogoBox.zw-uLogoBox.xy);
    if(q.x>0.&&q.x<1.&&q.y>0.&&q.y<1.) sc=mix(sc,texture(uLogo,q).rgb,uScr.y);
    alb=vec3(.42)*(1.-uScr.x*.8); rough=.92; emis=sc*.62*uScr.x;
  } else if(m==11){ emis=vC*6.; alb=vec3(0.);
  } else if(m==12){ alb=vec3(.015); rough=.35;
  } else if(m==13){ alb=vec3(.82,.83,.85); rough=.18; metal=1.;
  } else if(m==14){ rough=vUV.x; metal=vUV.y;
  } else if(m==15){ // sea
    vec2 p=vW.xz; float t=uTime;
    float fo=smoothstep(900.,60.,dist);
    vec2 g=vec2(0.); for(int i=0;i<5;i++){ float fi=float(i); vec2 dir=normalize(vec2(sin(fi*2.3+1.),cos(fi*1.7))); float k=.35*pow(1.7,fi);
      g+=dir*cos(dot(dir,p)*k+t*(.8+.3*fi))*(.22/(1.+fi)); }
    g+=(vec2(vnoise(p*2.+t*.4),vnoise(p*2.3-t*.35))-.5)*.5*fo;
    N=normalize(vec3(-g.x,1.,-g.y)); alb=vec3(.02,.06,.09); rough=.12; metal=0.;
  } else if(m==16){ alb=vC*(.7+.6*hash21(floor(P.xz*40.)+floor(P.y*40.))); rough=.6;
  }
  } else { alb=vec3(.6); if(m==11) emis=vec3(2.); }
  // contact darkening
  if(indoor>.5){
    vec3 b0,b1; if(vW.x>-9.03){ b0=vec3(-9.,0.,0.); b1=vec3(-.05,4.5,9.); } else if(vW.x>-15.05){ b0=vec3(-15.,0.,5.3); b1=vec3(-9.,2.8,7.7); } else { b0=vec3(-24.,0.,1.); b1=vec3(-15.,3.,10.5); }
    vec3 da=abs(vW-b0), db=abs(vW-b1); vec3 dm=min(da,db);
    float d1=min(dm.x,min(dm.y,dm.z)); float d3=max(dm.x,max(dm.y,dm.z)); float d2=dm.x+dm.y+dm.z-d1-d3;
