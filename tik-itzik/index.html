<title>תיק לקוח · איציק כהן · iRON MENTSH</title>
<style>
:root{
  --navy:#151b3d; --ink:#1c2140; --muted:#6b7190; --line:#e2e5f0; --bg:#f5f6fb; --card:#ffffff;
  --blue:#1f4fe0; --violet:#6b2fd6; --ok:#1f9d55; --warn:#d6453d; --soft:#eef1ff;
  --grad:linear-gradient(90deg,var(--blue),var(--violet));
  --r:16px; --shadow:0 6px 24px rgba(21,27,61,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Heebo",Arial,sans-serif;font-size:17px;line-height:1.55;min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 8px}
.logo{height:46px;width:auto;display:block}
.pct{font-size:14px;color:var(--muted);white-space:nowrap}
.pct b{color:var(--navy);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .4s ease}
.dots{display:flex;gap:6px;justify-content:space-between;padding-bottom:10px}
.dots span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.dots span.on{background:var(--grad)}
.dots span.done{background:var(--navy)}
main{flex:1;padding:18px 0 150px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px;margin-bottom:14px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--navy)}
h1:focus,h2:focus{outline:none}
h2{font-size:21px;line-height:1.3;margin:0 0 4px;color:var(--navy)}
h3{font-size:17px;margin:18px 0 6px;color:var(--navy)}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:16px}
.why{font-size:14px;color:var(--muted);margin:-2px 0 10px}
label.f{display:block;margin:14px 0 0}
label.f>span{display:block;font-weight:600;margin-bottom:6px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=month],textarea,select{
  width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,79,224,.12)}
input.bad,textarea.bad{border-color:var(--warn)}
.err{color:var(--warn);font-size:14px;margin:6px 0 0;min-height:0}
.ltr{direction:ltr;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{min-height:44px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip.on{border-color:var(--blue);background:var(--soft);color:var(--navy);font-weight:600}
.chip.on::before{content:"✓";font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.row>*{flex:1 1 150px;min-width:0}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--navy);margin:14px 0 0}
.known{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.known span{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:14px}
.tile{display:block;border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:#fff;min-height:120px;position:relative}
.tile.has{border-style:solid;border-color:var(--blue);padding:12px}
.tile input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tile img{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto 8px;background:#fff}
.tile .t{font-weight:600;color:var(--navy)}
.tile .s{font-size:14px;color:var(--muted)}
.tile .x{position:absolute;top:8px;left:8px;z-index:2;min-height:44px;min-width:44px;font-size:16px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.art{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#fff}
.art .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.art .num{font-weight:700;color:var(--navy)}
.art .del{min-height:44px;min-width:44px;border:none;background:none;color:var(--warn);cursor:pointer;font-size:15px}
.outlet{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px;font-size:14px;margin-top:8px}
.outlet.unknown{background:#8a90ab}
a.btn{text-decoration:none}
.btn{min-height:52px;border-radius:14px;border:none;cursor:pointer;font-weight:700;font-size:17px;padding:12px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(31,79,224,.25)}
.btn.g{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.t{background:none;color:var(--muted);font-weight:500;min-height:44px}
.btn.w{width:100%}
.btn.add{background:var(--soft);color:var(--navy);width:100%;margin-top:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
footer{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:10px;align-items:center}
.nav .btn.p{flex:1}
.peek{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;margin-bottom:8px;overflow:hidden}
.peek .bar2{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;font-size:14px}
.peek .bar2 b{font-weight:600}
.peek .body{display:none;padding:4px 14px 14px}
.peek.open .body{display:block}
.hero{display:flex;gap:12px;align-items:center}
.hero .av{width:64px;height:64px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden;flex:none}
.hero .av img{width:100%;height:100%;object-fit:cover}
.hero .n{font-weight:700;font-size:18px;line-height:1.2}
.hero .tt{font-size:14px;opacity:.85}
.hero .sv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hero .sv span{font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 8px}
.hero .cta{margin-top:10px;display:flex;gap:8px}
.hero .cta span{flex:1;text-align:center;font-size:13px;border-radius:9px;padding:7px;background:rgba(255,255,255,.14)}
.hero .cta span.b{background:#fff;color:var(--navy);font-weight:700}
.sum{border-top:1px solid var(--line);padding:12px 0}
.sum:first-of-type{border-top:none}
.sum .h{display:flex;justify-content:space-between;align-items:center}
.sum .h b{color:var(--navy)}
.sum .h button{min-height:44px;padding:0 10px;border:none;background:none;color:var(--blue);cursor:pointer;font-weight:600}
.sum ul{margin:6px 0 0;padding:0 18px 0 0;color:var(--ink);font-size:15px}
.sum .miss{color:var(--warn)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:12px;background:var(--soft);cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;flex:none}
.fin{text-align:center;padding:30px 0 10px}
.fin .big{width:84px;height:84px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 14px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:10px;padding:8px 12px;display:inline-block;direction:ltr;letter-spacing:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
.meter{font-size:13px;color:var(--muted);margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#wall-test{display:none;white-space:pre-wrap;direction:ltr;font-size:12px}
</style>
</head>

function normUrl(s){ s = String(s||'').trim(); if (!s) return ''; if (!/^https?:\/\//i.test(s)) s = 'https://'+s; return s; }
function isUrl(s){ s = normUrl(s); return /^https?:\/\/[^\s/]+\.[^\s/]{2,}/i.test(s); }
function hostOf(s){ const m = normUrl(s).match(/^https?:\/\/([^/?#]+)/i); return m ? m[1].toLowerCase().replace(/^www\./,'') : ''; }
function outletOf(s){ const h = hostOf(s); if (!h) return {name:'', known:false}; for (const [k,v] of OUTLETS){ if (h===k || h.endsWith('.'+k) || h.includes(k)) return {name:v, known:true}; } return {name:h, known:false}; }
function initials(n){ const p = String(n||'').replace(/[,\-–].*$/,'').trim().split(/\s+/); return p.slice(0,2).map(x=>x[0]||'').join(''); }
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms); }

/* base64 כתוב ביד */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64enc(u8){ let out=''; for (let i=0;i<u8.length;i+=3){ const a=u8[i], b=i+1<u8.length?u8[i+1]:0, c=i+2<u8.length?u8[i+2]:0; const v=(a<<16)|(b<<8)|c; out+=B64[(v>>18)&63]+B64[(v>>12)&63]+(i+1<u8.length?B64[(v>>6)&63]:'=')+(i+2<u8.length?B64[v&63]:'='); } return out; }
/* UTF-8 ו-FNV-1a 32 ביט כתובים ביד: טביעת אצבע של התיק */
function utf8(str){ const out=[]; for (let i=0;i<str.length;i++){ let c=str.charCodeAt(i); if (c>=0xD800 && c<=0xDBFF && i+1<str.length){ const d=str.charCodeAt(i+1); if (d>=0xDC00 && d<=0xDFFF){ c=0x10000+((c-0xD800)<<10)+(d-0xDC00); i++; } } if (c<0x80) out.push(c); else if (c<0x800) out.push(0xC0|(c>>6),0x80|(c&63)); else if (c<0x10000) out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); else out.push(0xF0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); } return out; }
function fnv1a(str){ let h=0x811c9dc5; for (const b of utf8(str)){ h^=b; h=Math.imul(h,0x01000193)>>>0; } return ('00000000'+h.toString(16)).slice(-8); }

/* ---- שמירה אוטומטית: טקסט ב-localStorage, קבצים ב-IndexedDB ---- */
function saveText(){ try{ S.updated=new Date().toISOString(); const c={...S, media:{...S.media, photo:S.media.photo?{...S.media.photo,b64:''}:null, logo:S.media.logo?{...S.media.logo,b64:''}:null}}; localStorage.setItem(LS_KEY, JSON.stringify(c)); }catch(e){} }
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('tik-itzik',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise((res,rej)=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
async function idbGet(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const t=db.transaction('files','readonly'); const q=t.objectStore('files').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
function restoreText(){ try{ const raw=localStorage.getItem(LS_KEY); if (raw){ const o=JSON.parse(raw); if (o && o.v===1){ S={...fresh(), ...o}; if (S.media.photo && !S.media.photo.b64) S.media.photo=null; if (S.media.logo && !S.media.logo.b64) S.media.logo=null; return true; } } }catch(e){} return false; }
async function restoreFiles(){ let got=false; for (const k of ['photo','logo']){ const f=await idbGet(k); if (f && f.b64){ S.media[k]=f; got=true; } } return got; }
let saveT=null; function save(){ clearTimeout(saveT); saveT=setTimeout(saveText, 250); progress(); peek(); }

/* ---- התקדמות ---- */
function checks(){
  const c=S.contact, b=S.brand, m=S.media;
  const arts = S.articles.filter(a=>isUrl(a.url)&&a.client&&a.mention);
  return [
    ['שם המותג', !!b.name.trim(), 1], ['כותרת', !!b.title.trim(), 1], ['אודות', b.about.trim().length>=20, 2], ['שירותים', b.services.length>0, 1],
    ['טלפון', isPhone(c.phone), 2], ['וואטסאפ', c.whatsappSame ? isPhone(c.phone) : isPhone(c.whatsapp), 1], ['מייל', !!c.email && isEmail(c.email), 1],
    ['תמונת תדמית', !!(m.photo&&m.photo.b64), 3], ['לוגו', !!(m.logo&&m.logo.b64) || m.noLogo, 1],
    ['כתבה ראשונה', arts.length>=1, 3], ['שלוש כתבות', arts.length>=3, 2],
    ['סגנון', S.prefs.tone.length>0, 1], ['אישור', S.confirm.ok, 2]
  ];
}
function pctCalc(){ const cs=checks(); const tot=cs.reduce((a,x)=>a+x[2],0); const got=cs.filter(x=>x[1]).reduce((a,x)=>a+x[2],0); return Math.round(100*got/tot); }
function progress(){ const p=pctCalc(); $('#pct').textContent=p+'%'; $('#bar').style.width=p+'%'; $('#barbox').setAttribute('aria-valuenow',p); const d=$('#dots'); d.innerHTML=''; for (let i=1;i<=6;i++){ const s=document.createElement('span'); if (i<S.stage) s.className='done'; else if (i===S.stage) s.className='on'; d.appendChild(s); } }

/* ---- הצצה חיה ---- */
function peek(){
  const b=S.brand, c=S.contact, ph=S.media.photo;
  const av = ph&&ph.b64 ? `<img src="data:${esc(ph.type)};base64,${ph.b64}" alt="">` : esc(initials(b.name)||'א');
  $('#peekbody').innerHTML = `<div class="hero"><div class="av">${av}</div><div style="flex:1;min-width:0"><div class="n">${esc(b.name.replace(/,.*$/,'')||'השם שלך')}</div><div class="tt">${esc(b.title||'הכותרת שלך')}</div><div class="sv">${b.services.slice(0,3).map(s=>`<span>${esc(s)}</span>`).join('')}</div></div></div><div class="hero"><div class="cta" style="flex:1"><span class="b">📞 ${esc(c.phone?fmtPhone(c.phone):'התקשרו')}</span><span>וואטסאפ</span></div></div>`;
}

/* ---- שלבים ---- */
const TITLES = ['','מי אתה','פרטי קשר','תמונה ולוגו','כתבות שהשגת','סגנון והעדפות','סיכום ושליחה'];
function go(n){ S.stage=Math.max(0,Math.min(7,n)); saveText(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  const st=$('#stage'); st.innerHTML = STAGES[S.stage](); bind(st); progress(); peek(); nav();
  const h=st.querySelector('h1,h2'); if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}
function nav(){
  const n=$('#nav'); const s=S.stage;
  if (s===0) n.innerHTML = `<button class="btn p w" data-go="1">מתחילים ←</button>`;
  else if (s===7) n.innerHTML = `<button class="btn g" data-go="6">חזרה לסיכום</button><button class="btn p" data-act="send">שלח שוב</button>`;
  else if (s===6) n.innerHTML = `<button class="btn g" data-go="5">חזרה</button><button class="btn p" data-act="send" id="sendbtn">📤 שלח לאיירון</button>`;
  else n.innerHTML = `<button class="btn g" data-go="${s-1}">חזרה</button><button class="btn p" data-act="next">המשך ←</button>`;
  $('#peek').style.display = (s===0||s===7)?'none':'';
}

    const k=el.dataset.k;

    else { el.addEventListener('input',()=>{ setK(k, el.value); save(); if (k.startsWith('articles.')&&k.endsWith('.url')){ const i=+k.split('.')[1]; const card=root.querySelector(`.art[data-i="${i}"]`); const old=card.querySelector('.outlet'); if (old) old.remove(); if (el.value){ const o=outletOf(el.value); el.closest('label').insertAdjacentHTML('afterend', `<span class="outlet ${o.known?'':'unknown'}">${o.known?'📰':'🔗'} ${esc(o.name||'קישור')}</span>`); } } if (k==='brand.name'||k==='brand.title'||k==='contact.phone') peek(); });

  });

  root.querySelectorAll('[data-one]').forEach(box=>{ const k=box.dataset.one; box.querySelectorAll('.chip').forEach(ch=>{ const f=()=>{ setK(k, ch.dataset.v); save(); box.querySelectorAll('.chip').forEach(x=>{ x.classList.toggle('on', x===ch); x.setAttribute('aria-checked', x===ch); }); }; ch.addEventListener('click',f); ch.addEventListener('keydown',e=>{ if (e.key===' '||e.key==='Enter'){ e.preventDefault(); f(); } }); }); });

function next(){
  const s=S.stage; let ok=true; const mark=(sel,msg)=>{ const el=document.querySelector(sel); if (el){ el.classList.add('bad'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); const er=el.parentElement.querySelector('.err'); if (er) er.textContent=msg; if (ok) el.focus(); } ok=false; };
  if (s===1){ if (!S.brand.name.trim()) mark('[data-k="brand.name"]','צריך שם'); if (!S.brand.title.trim()) mark('[data-k="brand.title"]','צריך כותרת קצרה'); if (S.brand.about.trim().length<20) mark('[data-k="brand.about"]','כמה מילים על עצמך, לפחות משפט'); if (!S.brand.services.length){ toast('בחר לפחות שירות אחד'); ok=false; } }
  if (s===2){ if (!isPhone(S.contact.phone)) mark('[data-k="contact.phone"]','מספר ישראלי, למשל 050-1234567'); if (!S.contact.whatsappSame && !isPhone(S.contact.whatsapp)) mark('[data-k="contact.whatsapp"]','מספר וואטסאפ תקין'); if (S.contact.email && !isEmail(S.contact.email)) mark('[data-k="contact.email"]','כתובת מייל לא תקינה'); }
  if (s===3){ if (!(S.media.photo&&S.media.photo.b64)){ const er=document.querySelector('[data-err="photo"]'); if (er) er.textContent='בלי תמונה אין אתר. בחר תמונה, גם זמנית.'; ok=false; } }
  if (s===4){ S.articles.forEach((a,i)=>{ if (a.url && !isUrl(a.url)) mark(`[data-k="articles.${i}.url"]`,'זה לא נראה כמו קישור'); }); }
  if (!ok){ toast('יש משהו קטן להשלים'); return; }
  go(s+1);
}

/* ---- קבצים: נקראים כבייטים, נשמרים אחד לאחד ---- */
function pickFile(k, file){
  if (!file) return;
  if (file.size > 25*1048576){ toast('הקובץ גדול מדי (מעל 25MB). בחר קובץ קטן יותר.', 3500); return; }
  const r=new FileReader();
  r.onload=()=>{ const u8=new Uint8Array(r.result); const f={name:file.name,type:file.type||'application/octet-stream',size:file.size,b64:b64enc(u8),w:0,h:0,added:new Date().toISOString()};
    const fin=()=>{ S.media[k]=f; idbSet(k,f); save(); render(); toast(k==='photo'?'התמונה נשמרה':'הלוגו נשמר'); };
    if (/^image\//.test(f.type)){ const im=new Image(); im.onload=()=>{ f.w=im.naturalWidth; f.h=im.naturalHeight; fin(); }; im.onerror=fin; im.src='data:'+f.type+';base64,'+f.b64; } else fin(); };
  r.onerror=()=>toast('לא הצלחנו לקרוא את הקובץ');
  r.readAsArrayBuffer(file);
}

function canShareFiles(){ try{ return !!(navigator.canShare && navigator.canShare({files:[new File(['x'],'x.html',{type:'text/html'})]})); }catch(e){ return false; } }
async function shareBundle(html, name){
  if (!navigator.share) return false;
  let file=null; try{ file=new File([html], name, {type:'text/html'}); }catch(e){ return false; }
  if (!(navigator.canShare && navigator.canShare({files:[file]}))) return false;
  try{ await navigator.share({files:[file], title:'תיק לקוח · '+S.brand.name}); return true; }catch(e){ if (e && e.name==='AbortError') return 'abort'; return false; }

}

  S.articles=[{url:['https:','','www.ynet.co.il','news','article','1'].join('/'),client:'עיריית X',hideClient:false,mention:'מוזכר בגוף הכתבה',when:'2026-03',topic:''}]; S.confirm.ok=true; }

/* ===== בדיקת קיר (wall.json): רצה רק עם ?test=1, בקוד טהור ===== */
async function wallTest(){
  const R={H:0,S:0,M:0,R:0,notes:[]};
  const wq=(location.search.match(/[?&]w=(\d+)/)||[])[1]; if (wq){ const st=document.createElement('style'); st.textContent=`html,body,header,footer,main,.toast{max-width:${wq}px!important;margin-left:0!important}`; document.head.appendChild(st); }
  // S — שלמות התיק אחרי מילוי מדומה
  sampleFill();
  const html=buildBundle(); let d=null; try{ const m=html.match(/<script type="application\/json" id="tik-data">([\s\S]*?)<\/script>/); d=JSON.parse(m[1]); }catch(e){ R.notes.push('bundle JSON not parseable'); }
  const req=[['brand.name',x=>x.brand.name],['brand.title',x=>x.brand.title],['brand.about',x=>x.brand.about],['brand.services',x=>x.brand.services.length],['contact.phone',x=>x.contact.phone],['contact.whatsappE164',x=>x.contact.whatsappE164],['media.photo.b64',x=>x.media.photo&&x.media.photo.b64],['articles[0].url',x=>x.articles[0]&&x.articles[0].url],['articles[0].client',x=>x.articles[0]&&x.articles[0].client],['articles[0].mention',x=>x.articles[0]&&x.articles[0].mention],['articles[0].outlet',x=>x.articles[0]&&x.articles[0].outlet==='ynet'],['confirm.ok',x=>x.confirm.ok]];
  let got=0; for (const [k,f] of req){ let v=null; try{ v=d&&f(d); }catch(e){} if (v) got++; else R.notes.push('missing '+k); }
  R.S=Math.round(10*got/req.length); R.S_detail=got+'/'+req.length;
  R.bundleIsHtml = /^<!doctype html>/i.test(html) && /<\/html>\s*$/.test(html);
  try{ const raw=atob(S.media.photo.b64); const u8=new Uint8Array(raw.length); for (let i=0;i<raw.length;i++) u8[i]=raw.charCodeAt(i); R.b64roundtrip = (b64enc(u8)===S.media.photo.b64) && u8[0]===0x89 && u8[1]===0x50; }catch(e){ R.b64roundtrip=false; } if (!R.b64roundtrip){ R.S=0; R.notes.push('b64 roundtrip failed'); }
  R.code = S.code;
  // H — הרמטיות: סריקת המקור של הדף עצמו
  const src=document.documentElement.outerHTML.replace(/<meta\s[^>]*>/gi,''); const bad=[];
  if (/<script\s[^>]*src=/i.test(src)) bad.push('script src'); if (/<link\s[^>]*href=/i.test(src)) bad.push('link href'); if (new RegExp('@'+'import').test(src)) bad.push('@'+'import'); if (/\bfetch\s*\(/.test(src)) bad.push('fetch');
  const urls=(src.match(/https?:\/\/[^\s"'<>)]{3,}/g)||[]).filter(u=>!/^https:\/\/wa\.me\//.test(u)); if (urls.length) bad.push('urls:'+urls.slice(0,5).join(','));
  R.H = bad.length?0:10; if (bad.length) R.notes.push('external: '+bad.join(' | '));
  // M — מובייל: כל שלב, בלי גלילה אופקית, יעדי מגע ≥44
  let mOk=true; const vw=wq?+wq:document.documentElement.clientWidth; let waLink=false; for (let st=0; st<=7; st++){ S.stage=st; render(); if (st===4 && !S.articles.length){ S.articles.push({url:'',client:'',hideClient:false,mention:'',when:'',topic:''}); render(); } const sw=Math.max(document.querySelector('main .wrap').scrollWidth, ...[...document.querySelectorAll('main .card, main .art, main .chips, main .row')].map(e=>e.scrollWidth)); if (sw>vw){ mOk=false; R.notes.push('hscroll stage '+st+' '+sw+'>'+vw); } if (st===7 && document.querySelector('a[href^="https://wa.me/972503070350"]')) waLink=true; document.querySelectorAll('main button, main .chip, main input:not([type=file]):not([type=checkbox]), main textarea, footer .btn').forEach(el=>{ const r=el.getBoundingClientRect(); if (r.width>0 && r.height>0 && r.height<44){ mOk=false; R.notes.push('tap<44 stage '+st+' '+(el.className||el.tagName)+' '+Math.round(r.height)); } }); }
  R.M = mOk?10:0; R.viewport=vw;
  // R — שלוש שכבות חזרה קיימות ומצביעות על איירון
  const layers=[typeof shareBundle==='function', typeof downloadBundle==='function' && waLink, typeof copySummary==='function' && /קוד תיק/.test(waText())];
  R.R = layers.every(Boolean)?10:(layers.some(Boolean)?5:0); R.layers=layers;
  R.score=Math.min(R.H,R.S,R.M,R.R);
  S.stage=0; render();
  const out='WALLTEST '+JSON.stringify(R)+' ENDWALL'; $('#wall-test').textContent=out; document.title=out;
}
</script>
